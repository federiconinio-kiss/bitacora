name: Backup diario de la base

on:
  schedule:
    - cron: '17 6 * * *'   # todos los días 03:17 (hora de Argentina)
  workflow_dispatch:        # también se puede correr a mano desde la pestaña Actions

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Instalar pg_dump 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Revisar la dirección de la base (sin mostrar la contraseña)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python3 - <<'PY'
          import os, sys, urllib.parse as u
          raw = os.environ.get('SUPABASE_DB_URL', '')
          if not raw:
              sys.exit('Falta el secret SUPABASE_DB_URL.')
          problemas = []
          if '[' in raw or ']' in raw:
              sys.exit('Revisá SUPABASE_DB_URL: tiene corchetes [ ]. Sacalos: la contraseña va sola entre ":" y "@".')
          if raw != raw.strip():
              problemas.append('la dirección tiene espacios o saltos de línea al principio o al final')
          p = u.urlsplit(raw.strip())
          user, pwd, host = p.username or '', p.password or '', p.hostname or ''
          print(f'usuario: {user}')
          print(f'servidor: {host}:{p.port}')
          print(f'base: {p.path.lstrip("/")}')
          print(f'contraseña: {len(pwd)} caracteres')
          if p.scheme not in ('postgres', 'postgresql'):
              problemas.append('no empieza con postgresql://')
          if '[' in pwd or ']' in pwd or 'YOUR-PASSWORD' in pwd:
              problemas.append('la contraseña todavía tiene corchetes o dice YOUR-PASSWORD')
          if any(not c.isalnum() for c in u.unquote(pwd)):
              problemas.append('la contraseña tiene símbolos: usá sólo letras y números')
          if 'pooler.supabase.com' in host and '.' not in user:
              problemas.append('con el Session pooler el usuario tiene que ser postgres.<id del proyecto>')
          if raw.count('@') > 1:
              problemas.append('hay más de una @ (¿la contraseña tiene @?)')
          if problemas:
              sys.exit('Revisá SUPABASE_DB_URL: ' + '; '.join(problemas))
          print('La forma de la dirección está bien.')
          PY

      - name: Copia de la base
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PG_DUMP: /usr/lib/postgresql/17/bin/pg_dump
        run: scripts/backup.sh backups

      - name: Guardar la copia (30 días)
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_number }}
          path: backups/
          retention-days: 30

      # Una consulta liviana para que Supabase no pause el proyecto por inactividad.
      - name: Mantener activo el proyecto
        if: ${{ env.SUPABASE_URL != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -fsS -o /dev/null "$SUPABASE_URL/rest/v1/exercises?select=id&limit=1" -H "apikey: $SUPABASE_ANON_KEY" && echo "Supabase respondió OK"
