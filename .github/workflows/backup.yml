name: Backup diario de la base

on:
  schedule:
    - cron: '17 6 * * *'   # todos los días 03:17 (hora de Argentina)
  workflow_dispatch:        # también se puede correr a mano desde la pestaña Actions

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Instalar pg_dump 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Revisar la dirección de la base (sin mostrar la contraseña)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python3 - <<'PY'
          import os, re, sys
          raw = os.environ.get('SUPABASE_DB_URL', '')
          if not raw:
              sys.exit('Falta el secret SUPABASE_DB_URL.')
          url = raw.strip()
          # Partes: esquema://usuario:contraseña@servidor:puerto/base (la contraseña va hasta la última @)
          m = re.match(r'^([a-z]+)://([^:@/]*):(.*)@([^@]*)$', url)
          if not m:
              sys.exit('Revisá SUPABASE_DB_URL: no tiene la forma postgresql://usuario:contraseña@servidor:puerto/base')
          scheme, user, pwd, rest = m.groups()
          print('Dirección (contraseña tapada):', f'{scheme}://{user}:***@{rest}')
          print(f'Contraseña: {len(pwd)} caracteres')
          problemas = []
          if raw != url: problemas.append('tiene espacios o saltos de línea al principio o al final')
          if scheme not in ('postgres', 'postgresql'): problemas.append('no empieza con postgresql://')
          if '[' in rest or ']' in rest: problemas.append('hay corchetes [ ] en la parte del servidor (después de la @)')
          if '[' in pwd or ']' in pwd or 'YOUR-PASSWORD' in pwd: problemas.append('la contraseña tiene corchetes o dice YOUR-PASSWORD')
          # Estos caracteres rompen la dirección (salvo que estén codificados como %XX). Letras, números y - _ . ~ funcionan bien.
          malos = sorted({c for c in re.sub(r'%[0-9A-Fa-f]{2}', '', pwd) if c in ' @:/?#[]%' or ord(c) < 33})
          if malos: problemas.append('la contraseña tiene caracteres que rompen la dirección: ' + ' '.join('espacio' if c == ' ' else repr(c) for c in malos) + '. Cambiá la contraseña por una de letras y números')
          if 'pooler.supabase.com' in rest and '.' not in user: problemas.append('con el Session pooler el usuario tiene que ser postgres.<id del proyecto>')
          if problemas:
              sys.exit('Revisá SUPABASE_DB_URL: ' + '; '.join(problemas))
          print('La forma de la dirección está bien.')
          PY

      - name: Copia de la base
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PG_DUMP: /usr/lib/postgresql/17/bin/pg_dump
        run: scripts/backup.sh backups

      - name: Guardar la copia (30 días)
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_number }}
          path: backups/
          retention-days: 30

      # Una consulta liviana para que Supabase no pause el proyecto por inactividad.
      - name: Mantener activo el proyecto
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::Faltan los secrets SUPABASE_URL o SUPABASE_ANON_KEY: no se pudo mantener activo el proyecto."
            exit 0
          fi
          # Sólo el origen (https://xxxx.supabase.co), aunque el secret tenga /rest/v1/ u otra ruta al final.
          BASE=$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]' | sed -E 's#^(https?://[^/]+).*#\1#')
          # Estado del servicio de login: responde sin sesión (las tablas de la app no, por seguridad).
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/auth/v1/health" -H "apikey: $(printf '%s' "$SUPABASE_ANON_KEY" | tr -d '[:space:]')")
          echo "Supabase respondió: $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::warning::Supabase respondió $CODE. Revisá que SUPABASE_URL sea https://<id>.supabase.co y SUPABASE_ANON_KEY la clave publishable."
          fi
